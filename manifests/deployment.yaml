apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-api
  namespace: predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictor-api
  template:
    metadata:
      labels:
        app: predictor-api
    spec:
      volumes:
        - name: shared-image # just giving it a name
          persistentVolumeClaim: 
            claimName: predictor-pvc # reference to the PVC we created , kubernetes matches name via "storageClassName"
      containers:
        - name: predictor-container
          image: ramadhanzome/fastapi-prediction-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
              name: prediction-config  # pull all variables from this configmap
          volumeMounts:
            - name: shared-image # the folder we created above
              mountPath: /app/data # make it appear here inside the container
        - name: second-container # 2nd container
          image: nginx # just any image for testing
          volumeMounts:
            - name: shared-image # same shared folder
              mountPath: /app/data # same path