apiVersion: v1
kind: PersistentVolume
metadata:
  name: predictor-pv # name of this storage unit
spec:
  storageClassName: predictor-storage # label used to match with the claim
  capacity:
    storage: 1Gi # 1 gigabyte of storage
  volumeMode: Filesystem # mount as a folder inside the pod
  accessModes:
    - ReadWriteOnce # only one pod can use it at a time
  local:
    path: /tmp/kube # the folder we created on the node
  nodeAffinity: ## This is only required for local, it defines which nodes can access it
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3d-predictor-api-server-0 # our node
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: predictor-pv-2 # second PV for predictor namespace
spec:
  storageClassName: predictor-storage
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  local:
    path: /tmp/kube2 # different folder
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3d-predictor-api-server-0